<!DOCTYPE html>
<html>
<head>
    <title>Library Book Tracker</title>
    <style>
        table { border-collapse: collapse; width: 85%; margin-top: 20px; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        .available { color: green; font-weight: bold; }
        .not-available { color: red; font-weight: bold; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

<h2>Library Book Tracker</h2>

<input type="text" id="bookId" placeholder="Book ID">
<input type="text" id="bookTitle" placeholder="Title">
<input type="text" id="bookAuthor" placeholder="Author">
<select id="bookStatus">
    <option value="">Select Availability</option>
    <option value="Available">Available</option>
    <option value="Not Available">Not Available</option>
</select>

<button onclick="addBook()">Add</button>
<button onclick="updateBook()">Update Status</button>
<button onclick="deleteBook()">Delete</button>

<p id="message"></p>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Availability</th>
        </tr>
    </thead>
    <tbody id="bookTable"></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
