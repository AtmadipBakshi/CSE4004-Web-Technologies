<!DOCTYPE html>
<html>
<head>
    <title>Product Inventory System</title>
    <style>
        table { border-collapse: collapse; width: 90%; margin-top: 20px; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        .low-stock { color: red; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<h2>Product Inventory System</h2>

<input type="number" id="productId" placeholder="Product ID">
<input type="text" id="productName" placeholder="Product Name">
<input type="number" id="productPrice" placeholder="Price">
<input type="number" id="productQty" placeholder="Quantity">

<button onclick="addProduct()">Add</button>
<button onclick="updateProduct()">Update</button>
<button onclick="deleteProduct()">Delete</button>

<br><br>

<input type="text" id="searchBox" placeholder="Search by name" onkeyup="searchProduct()">

<p id="message"></p>

<h3>Total Inventory Value: ₹ <span id="totalValue">0</span></h3>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price (₹)</th>
            <th>Quantity</th>
            <th>Total Value</th>
        </tr>
    </thead>
    <tbody id="productTable"></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
